<title>雪融之夏</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@400;600&family=ZCOOL+XiaoWei&display=swap">
<style>
/* Layout: a book, not a website. A contents page with a vertical title, then one chapter per view
   in a single ~34-character column; a slim sticky bar carries the chapter name, progress, language and reading settings.
   Palette from the story: late-summer paper, ink, and the 墨绿 of the café's curtains. */
:root {
  --paper: #F3F5F1;
  --ink: #1E2320;
  --muted: #69736E;
  --faint: #D6DDD8;
  --accent: #2E5B4E;
  --bar: rgba(243, 245, 241, 0.92);
  --inset: #E8ECE6;
  --f-title: "ZCOOL XiaoWei", "Noto Serif SC", "Songti SC", serif;
  --f-body: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --f-en: "Literata", Georgia, "Iowan Old Style", serif;
  --f-ui: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --fs: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141816; --ink: #D3DAD5; --muted: #8E9A94; --faint: #2B332F; --accent: #8FBFAF;
    --bar: rgba(20, 24, 22, 0.92); --inset: #1C221F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141816; --ink: #D3DAD5; --muted: #8E9A94; --faint: #2B332F; --accent: #8FBFAF;
  --bar: rgba(20, 24, 22, 0.92); --inset: #1C221F; color-scheme: dark;
}
/* reader's own choice overrides the system theme */
:root[data-skin="white"] { --paper: #FFFFFF; --ink: #1A1A1A; --muted: #6B6B6B; --faint: #E2E2E2; --accent: #2E5B4E; --bar: rgba(255,255,255,0.94); --inset: #F2F4F2; color-scheme: light; }
:root[data-skin="green"] { --paper: #E3EAD9; --ink: #26301F; --muted: #5F6B57; --faint: #C9D3BD; --accent: #3D6136; --bar: rgba(227,234,217,0.94); --inset: #D7DFCB; color-scheme: light; }
:root[data-skin="night"] { --paper: #101312; --ink: #B9C2BD; --muted: #7C8781; --faint: #252B28; --accent: #7FAE9F; --bar: rgba(16,19,18,0.94); --inset: #181D1B; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
:root:not([data-lang="en"]) .le, :root[data-lang="en"] .lz { display: none !important; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 64px); }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); margin: 0; transition: background-color .2s, color .2s; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bar); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--faint);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { max-width: 760px; margin: 0 auto; height: 48px; display: flex; align-items: center; gap: 10px; font-family: var(--f-ui); font-size: 14px; }
.bar .home { font-family: var(--f-title); font-size: 19px; color: var(--ink); text-decoration: none; letter-spacing: .08em; white-space: nowrap; }
:root[data-lang="en"] .bar .home { font-family: var(--f-en); font-size: 16px; letter-spacing: .01em; font-weight: 600; }
.bar .where { flex: 1; min-width: 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
.bar .btn { border: 1px solid var(--faint); background: transparent; border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; white-space: nowrap; }
.bar .btn:hover { border-color: var(--accent); color: var(--accent); }
.bar .lang { font-weight: 500; }
.progress { height: 2px; background: transparent; }
.progress span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .1s linear; }
@media (max-width: 420px) { .bar-in { gap: 6px; } .bar .btn { padding: 4px 9px; } .bar .where { display: none; } }

/* settings sheet */
.sheet { position: fixed; z-index: 12; top: calc(env(safe-area-inset-top, 0px) + 56px); right: max(12px, env(safe-area-inset-right, 0px)); width: min(320px, calc(100vw - 24px));
  background: var(--paper); border: 1px solid var(--faint); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.15); padding: 16px; font-family: var(--f-ui); font-size: 13.5px; display: grid; gap: 14px; }
.sheet .row { display: grid; gap: 8px; }
.sheet .lab { color: var(--muted); font-size: 12.5px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg button { border: 1px solid var(--faint); background: transparent; border-radius: 6px; padding: 7px 0; cursor: pointer; }
.seg button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 500; }
.seg .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--faint); margin-right: 5px; vertical-align: -1px; }

/* pages */
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 80px; }

/* contents / cover */
.cover { max-width: 760px; margin: 0 auto; padding-top: 48px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 40px; align-items: start; }
.vtitle { writing-mode: vertical-rl; font-family: var(--f-title); font-size: clamp(54px, 11vw, 88px); line-height: 1.05; letter-spacing: .18em; color: var(--ink); margin: 0; padding-top: 4px; font-weight: 400; }
.vtitle small { display: block; font-family: var(--f-ui); font-size: 13px; letter-spacing: .3em; color: var(--muted); margin-right: 14px; padding-top: 10px; }
.etitle { writing-mode: vertical-rl; transform: rotate(180deg); font-family: var(--f-en); font-weight: 400; font-size: clamp(40px, 7vw, 60px); line-height: 1.1; letter-spacing: .02em; margin: 0; color: var(--ink); }
.etitle small { display: block; font-family: var(--f-en); font-style: italic; font-size: 15px; letter-spacing: .02em; color: var(--muted); margin-left: 12px; }
.cover-side { min-width: 0; display: grid; gap: 22px; padding-top: 6px; }
.facts { font-family: var(--f-ui); font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; }
.facts b { color: var(--ink); font-weight: 500; }
.note-tr { font-family: var(--f-en); font-style: italic; font-size: 14px; color: var(--muted); margin: -8px 0 0; }
.go { display: flex; flex-wrap: wrap; gap: 10px; }
.go a { font-family: var(--f-ui); font-size: 14.5px; text-decoration: none; border-radius: 999px; padding: 9px 20px; border: 1px solid var(--accent); }
.go a.primary { background: var(--accent); color: var(--paper); }
.go a.primary:hover { filter: brightness(1.08); }
.blurb { font-size: 17px; line-height: 1.9; margin: 0; max-width: 30em; }
:root[data-lang="en"] .blurb { font-family: var(--f-en); font-size: 17px; line-height: 1.7; }
.cast { display: grid; gap: 10px; }
.cast-h { margin: 0; font-family: var(--f-ui); font-size: 12.5px; font-weight: 500; letter-spacing: .3em; color: var(--muted); }
:root[data-lang="en"] .cast-h { letter-spacing: .15em; text-transform: uppercase; }
.cast-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.person { margin: 0; display: grid; gap: 8px; align-content: start; min-width: 0; }
.person img { width: 100%; height: auto; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 6px; display: block; background: var(--inset); }
.person figcaption { display: grid; gap: 3px; font-family: var(--f-ui); font-size: 12.5px; line-height: 1.55; color: var(--muted); }
.person figcaption b { font-family: var(--f-body); font-size: 15px; font-weight: 600; color: var(--ink); }
:root[data-lang="en"] .person figcaption, :root[data-lang="en"] .person figcaption b { font-family: var(--f-en); }
:root[data-lang="en"] .person figcaption { font-size: 13px; line-height: 1.45; }
ol.toc { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--faint); }
ol.toc li { border-bottom: 1px solid var(--faint); }
ol.toc a, ol.toc .na { display: grid; grid-template-columns: 4.6em minmax(0, 1fr) auto; gap: 4px 12px; padding: 14px 4px; text-decoration: none; color: var(--ink); align-items: baseline; }
:root[data-lang="en"] ol.toc a, :root[data-lang="en"] ol.toc .na { grid-template-columns: 7.4em minmax(0, 1fr) auto; }
ol.toc .na { color: var(--muted); }
ol.toc a:hover .t { color: var(--accent); }
ol.toc .n { font-family: var(--f-ui); font-size: 13px; color: var(--muted); }
ol.toc .t { font-size: 18px; }
:root[data-lang="en"] ol.toc .t { font-family: var(--f-en); font-size: 17px; }
ol.toc .c { font-family: var(--f-ui); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
ol.toc .s { grid-column: 2 / 4; font-family: var(--f-body); font-size: 14px; color: var(--muted); line-height: 1.7; }
:root[data-lang="en"] ol.toc .s { font-family: var(--f-en); font-style: italic; font-size: 14.5px; line-height: 1.55; }
ol.toc li.read .n::after { content: " ·"; color: var(--accent); }
@media (max-width: 520px) {
  .cover { grid-template-columns: 1fr; gap: 24px; padding-top: 32px; }
  .vtitle, .etitle { writing-mode: horizontal-tb; transform: none; }
  .vtitle { letter-spacing: .12em; font-size: 46px; }
  .etitle { font-size: 40px; }
  .vtitle small { margin: 8px 0 0; padding: 0; letter-spacing: .2em; }
  .etitle small { margin: 6px 0 0; }
  .cast-row { gap: 10px; }
  .person figcaption { font-size: 12px; }
  ol.toc a, ol.toc .na { grid-template-columns: 4.2em minmax(0, 1fr) auto; }
  :root[data-lang="en"] ol.toc a, :root[data-lang="en"] ol.toc .na { grid-template-columns: minmax(0, 1fr) auto; }
  :root[data-lang="en"] ol.toc .n { grid-column: 1 / 3; }
  :root[data-lang="en"] ol.toc .s { grid-column: 1 / 3; }
}

/* chapter */
.chapter { max-width: 34em; margin: 0 auto; font-size: var(--fs); line-height: 1.95; }
.ch-head { text-align: center; padding: 64px 0 28px; }
.ch-num { font-family: var(--f-ui); font-size: 13px; letter-spacing: .4em; color: var(--muted); }
.ch-head h2 { font-family: var(--f-title); font-weight: 400; font-size: 2em; letter-spacing: .12em; margin: 10px 0 8px; text-wrap: balance; }
.ch-meta { font-family: var(--f-ui); font-size: 12.5px; color: var(--muted); }
.sec h3 { font-family: var(--f-body); font-weight: 600; font-size: 1em; color: var(--accent); text-align: center; letter-spacing: .2em; margin: 2.6em 0 1.4em; }
.chapter p { margin: 0 0 .85em; text-indent: 2em; text-align: justify; }
.chapter p.msg { text-indent: 0; margin-left: 2em; margin-right: 2em; padding: .5em .9em; background: var(--inset); border-radius: 4px 14px 14px 14px; font-size: .94em; }
.chapter blockquote { margin: 1.2em 2em; padding: .7em 1em; background: var(--inset); border-left: 3px solid var(--accent); font-size: .94em; line-height: 1.85; }
.break { display: flex; justify-content: center; gap: 1.1em; margin: 2.2em 0; }
.break span { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); opacity: .6; }
/* English chapters: book-style paragraphs */
.chapter[data-lang="en"] { font-family: var(--f-en); max-width: 33em; line-height: 1.7; hyphens: auto; -webkit-hyphens: auto; }
.chapter[data-lang="en"] .ch-num { letter-spacing: .25em; text-transform: uppercase; font-size: 12px; }
.chapter[data-lang="en"] .ch-head h2 { font-family: var(--f-en); letter-spacing: 0; font-size: 1.9em; font-weight: 400; font-style: italic; }
.chapter[data-lang="en"] .sec h3 { font-family: var(--f-en); letter-spacing: .08em; font-weight: 600; font-size: .95em; }
.chapter[data-lang="en"] p { text-indent: 1.4em; margin: 0; }
.chapter[data-lang="en"] h3 + p, .chapter[data-lang="en"] .break + p, .chapter[data-lang="en"] blockquote + p, .chapter[data-lang="en"] p.msg + p { text-indent: 0; }
.chapter[data-lang="en"] p.msg { margin: .8em 2em; text-indent: 0; }
.ch-nav { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin-top: 3.5em; padding-top: 1.6em; border-top: 1px solid var(--faint); font-family: var(--f-ui); font-size: 14px; }
.ch-nav a { text-decoration: none; padding: 8px 4px; }
.ch-nav .prev { justify-self: start; } .ch-nav .next { justify-self: end; text-align: right; }
.ch-nav .mid { color: var(--muted); }
.ch-nav small { display: block; color: var(--muted); font-size: 12px; }
.ch-end { text-align: center; font-family: var(--f-ui); font-size: 13px; letter-spacing: .3em; color: var(--muted); margin-top: 2.4em; }
.chapter[data-lang="en"] .ch-end { font-family: var(--f-en); font-style: italic; letter-spacing: .02em; font-size: 15px; }
@media (max-width: 520px) { .chapter p.msg, .chapter blockquote, .chapter[data-lang="en"] p.msg { margin-left: 0; margin-right: 0; } .ch-head { padding-top: 40px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="bar">
  <div class="bar-in">
    <a class="home" href="#contents"><span class="lz">雪融之夏</span><span class="le">Snowmelt Summer</span></a>
    <span class="where" id="where"></span>
    <button type="button" class="btn lang" id="btn-lang" aria-label="Switch language / 切换语言"><span class="lz">EN</span><span class="le">中文</span></button>
    <button type="button" class="btn" id="btn-toc"><span class="lz">目录</span><span class="le">Contents</span></button>
    <button type="button" class="btn" id="btn-set" aria-expanded="false" aria-controls="sheet">Aa</button>
  </div>
  <div class="progress" aria-hidden="true"><span id="prog"></span></div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-label="阅读设置 / Reading settings" hidden>
  <div class="row"><span class="lab"><span class="lz">字号</span><span class="le">Text size</span></span>
    <div class="seg" id="seg-fs"><button type="button" data-fs="16"><span class="lz">小</span><span class="le">S</span></button><button type="button" data-fs="18"><span class="lz">中</span><span class="le">M</span></button><button type="button" data-fs="20"><span class="lz">大</span><span class="le">L</span></button><button type="button" data-fs="23"><span class="lz">特大</span><span class="le">XL</span></button></div></div>
  <div class="row"><span class="lab"><span class="lz">背景</span><span class="le">Background</span></span>
    <div class="seg" id="seg-skin"><button type="button" data-skin="auto"><span class="lz">跟随</span><span class="le">Auto</span></button><button type="button" data-skin="white"><i class="sw" style="background:#fff"></i><span class="lz">白</span><span class="le">White</span></button><button type="button" data-skin="green"><i class="sw" style="background:#E3EAD9"></i><span class="lz">护眼</span><span class="le">Sage</span></button><button type="button" data-skin="night"><i class="sw" style="background:#101312"></i><span class="lz">夜间</span><span class="le">Night</span></button></div></div>
</div>

<main>
  <section class="cover" id="contents" aria-label="目录 / Contents">
    <h1 class="vtitle lz">雪融之夏<small>__RANGE__</small></h1>
    <h1 class="etitle le" lang="en">Snowmelt Summer<small>__EN_RANGE__</small></h1>
    <div class="cover-side">
      <div class="facts lz"><span><b>__NCH__</b> 章</span><span><b>__TOTAL__</b> 字</span><span>约 <b>__MINUTES__</b> 分钟读完</span></div>
      <div class="facts le"><span><b>__NCH__</b> chapters</span><span><b>__EN_TOTAL__</b> words</span><span>about <b>__EN_MINUTES__</b> minutes</span></div>
      <p class="blurb" id="blurb"></p>
      <p class="note-tr le" lang="en">Translated from the Chinese, paragraph by paragraph.</p>
      <div class="go" id="go"></div>
      <section class="cast" aria-labelledby="cast-h"><h2 class="cast-h" id="cast-h"></h2><div class="cast-row" id="cast"></div></section>
      <ol class="toc" id="toc"></ol>
    </div>
  </section>

__CHAPTERS__
</main>

<script id="toc-data" type="application/json">__TOC__</script>
<script id="extras" type="application/json">__EXTRAS__</script>
<script>
(function () {
  const TOCS = JSON.parse(document.getElementById('toc-data').textContent);
  const N = TOCS.zh.length;
  const T = {
    zh: { contents: '目录', start: '从第一章开始读', resume: '继续阅读 · ', restart: '从头开始', chars: n => n.toLocaleString() + ' 字',
          prev: '上一章', next: '下一章', end: n => n + ' 完', title: '雪融之夏', missing: '' },
    en: { contents: 'Contents', start: 'Start with Chapter One', resume: 'Continue · ', restart: 'Start over', chars: n => n.toLocaleString() + ' words',
          prev: 'Previous', next: 'Next', end: n => 'End of ' + n, title: 'Snowmelt Summer', missing: 'Translation coming' }
  };
  const store = {
    get(k, d) { try { const v = localStorage.getItem('xrzx-' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('xrzx-' + k, JSON.stringify(v)); } catch (e) {} }
  };
  const root = document.documentElement;
  const cover = document.getElementById('contents');
  const where = document.getElementById('where');
  const prog = document.getElementById('prog');
  const readSet = new Set(store.get('read', []));
  let lang = location.hash === '#en' ? 'en' : store.get('lang', 'zh');
  if (lang === 'en' && !document.querySelector('.chapter[data-lang="en"]')) lang = 'zh';
  const toc = () => TOCS[lang];
  const has = i => !!document.querySelector(`.chapter[data-lang="${lang}"][data-ch="${i}"]`);

  const EX = JSON.parse(document.getElementById('extras').textContent);
  function drawToc() {
    const L = T[lang], tc = toc(), ex = EX[lang];
    document.getElementById('blurb').textContent = ex.book;
    document.getElementById('cast-h').textContent = ex.cast_title;
    document.getElementById('cast').innerHTML = ex.cast.filter(p => EX.img[p.img]).map(p =>
      `<figure class="person"><img src="${EX.img[p.img]}" alt="${p.name}" width="360" height="480" loading="lazy"><figcaption><b>${p.name}</b><span>${p.line}</span></figcaption></figure>`).join('');
    document.getElementById('toc').innerHTML = tc.map((c, i) => c.missing
      ? `<li><span class="na"><span class="n">${TOCS.zh[i].num}</span><span class="t">${L.missing}</span><span class="c"></span></span></li>`
      : `<li class="${readSet.has(i + 1) ? 'read' : ''}"><a href="#ch${i + 1}"><span class="n">${c.num}</span><span class="t">${c.name}</span><span class="c">${L.chars(c.chars)}</span><span class="s">${c.teaser || ''}</span></a></li>`).join('');
    const last = store.get('last', null), go = document.getElementById('go');
    go.innerHTML = last && last.ch > 0 && last.ch <= N && has(last.ch)
      ? `<a class="primary" href="#ch${last.ch}" data-resume="1">${L.resume}${tc[last.ch - 1].num}</a><a href="#ch1">${L.restart}</a>`
      : `<a class="primary" href="#ch1">${L.start}</a>`;
    const r = go.querySelector('[data-resume]');
    if (r) r.addEventListener('click', () => { resumeNext = true; });
  }
  document.querySelectorAll('.chapter').forEach(a => {
    const i = +a.dataset.ch, l = a.dataset.lang, L = T[l], tc = TOCS[l], nav = a.querySelector('.ch-nav');
    const ok = k => !!document.querySelector(`.chapter[data-lang="${l}"][data-ch="${k}"]`);
    const prev = i > 1 ? `<a class="prev" href="#ch${i - 1}"><small>${L.prev}</small>${tc[i - 2].name}</a>` : '<span></span>';
    const next = i < N && ok(i + 1) ? `<a class="next" href="#ch${i + 1}"><small>${L.next}</small>${tc[i].name}</a>` : '<span></span>';
    nav.innerHTML = prev + `<a class="mid" href="#contents">${L.contents}</a>` + next;
    if (i === N || !ok(i + 1)) nav.insertAdjacentHTML('beforebegin', `<div class="ch-end">${L.end(tc[i - 1].num)}</div>`);
  });

  let current = 0, resumeNext = false;
  function show(keepScroll) {
    const m = /^#ch(\d+)$/.exec(location.hash);
    let i = m ? Math.min(Math.max(+m[1], 1), N) : 0;
    if (i && !has(i)) i = 0;
    current = i;
    cover.hidden = i !== 0;
    document.querySelectorAll('.chapter').forEach(a => { a.hidden = !(+a.dataset.ch === i && a.dataset.lang === lang); });
    const L = T[lang];
    if (i === 0) {
      drawToc(); where.textContent = L.contents; prog.style.width = '0';
      if (!keepScroll) window.scrollTo(0, 0);
    } else {
      const c = toc()[i - 1];
      where.textContent = `${c.num}　${c.name}`;
      const last = store.get('last', null);
      if (keepScroll) { /* language switch: keep relative position */ }
      else if (resumeNext && last && last.ch === i) requestAnimationFrame(() => window.scrollTo(0, last.r * (document.documentElement.scrollHeight - innerHeight)));
      else { window.scrollTo(0, 0); store.set('last', { ch: i, r: 0 }); }
      resumeNext = false;
    }
    closeSheet();
  }
  function setLang(l, fromUser) {
    const h = document.documentElement.scrollHeight - innerHeight, r = h > 0 ? scrollY / h : 0;
    lang = l; root.dataset.lang = l; root.lang = l === 'en' ? 'en' : 'zh-CN';
    document.title = T[l].title; store.set('lang', l);
    show(fromUser);
    if (fromUser && current) requestAnimationFrame(() => window.scrollTo(0, r * (document.documentElement.scrollHeight - innerHeight)));
  }
  let tick = 0;
  addEventListener('scroll', () => {
    if (!current) return;
    const h = document.documentElement.scrollHeight - innerHeight;
    const r = h > 0 ? Math.min(1, scrollY / h) : 1;
    prog.style.width = (r * 100).toFixed(1) + '%';
    const now = Date.now();
    if (now - tick > 400) {
      tick = now; store.set('last', { ch: current, r });
      if (r > 0.95 && !readSet.has(current)) { readSet.add(current); store.set('read', [...readSet]); }
    }
  }, { passive: true });
  addEventListener('hashchange', () => { if (location.hash === '#en') { setLang('en', false); } else show(false); });
  addEventListener('keydown', e => {
    if (e.target.closest('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight' && current && current < N && has(current + 1)) location.hash = 'ch' + (current + 1);
    if (e.key === 'ArrowLeft' && current > 1) location.hash = 'ch' + (current - 1);
    if (e.key === 'Escape') closeSheet();
  });

  const sheet = document.getElementById('sheet'), btnSet = document.getElementById('btn-set');
  function closeSheet() { sheet.hidden = true; btnSet.setAttribute('aria-expanded', 'false'); }
  btnSet.addEventListener('click', e => { e.stopPropagation(); sheet.hidden = !sheet.hidden; btnSet.setAttribute('aria-expanded', String(!sheet.hidden)); });
  document.addEventListener('click', e => { if (!sheet.hidden && !sheet.contains(e.target) && e.target !== btnSet) closeSheet(); });
  document.getElementById('btn-toc').addEventListener('click', () => { location.hash = 'contents'; });
  document.getElementById('btn-lang').addEventListener('click', () => setLang(lang === 'zh' ? 'en' : 'zh', true));
  function applyFs(v) { root.style.setProperty('--fs', v + 'px'); document.querySelectorAll('#seg-fs button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.fs === v))); store.set('fs', v); }
  function applySkin(v) { if (v === 'auto') delete root.dataset.skin; else root.dataset.skin = v; document.querySelectorAll('#seg-skin button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.skin === v))); store.set('skin', v); }
  document.querySelectorAll('#seg-fs button').forEach(b => b.addEventListener('click', () => applyFs(+b.dataset.fs)));
  document.querySelectorAll('#seg-skin button').forEach(b => b.addEventListener('click', () => applySkin(b.dataset.skin)));
  applyFs(store.get('fs', 18)); applySkin(store.get('skin', 'auto'));
  if (!document.querySelector('.chapter[data-lang="en"]')) document.getElementById('btn-lang').hidden = true;

  setLang(lang, false);
})();
</script>
